<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #2c3e50;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #42b883;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px;
    }

    button:hover {
      background-color: #369870;
    }
  </style>
</head>
<body>

  <h1>GitHub Test Page 🚀</h1>
  <p>If you can see this page, your Git push worked!</p>

  <button onclick="showMessage()">Click Me</button>

  <!-- New Button -->
  <button onclick="showAlert()">New Button</button>

  <p id="message"></p>

  <script>
    function showMessage() {
      document.getElementById("message").innerText = "JavaScript is working!";
    }

    function showAlert() {
      alert("This button was added from the feature branch!");
    }
  </script>

</body>
</html>
